<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rush | Time Trial</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Built-in Error Logger to catch silent crashes -->
    <script>
        window.addEventListener('error', function(e) {
            let errorDiv = document.getElementById('debug-error');
            if (!errorDiv) {
                errorDiv = document.createElement('div');
                errorDiv.id = 'debug-error';
                errorDiv.style.cssText = 'position:absolute; top:10px; left:10px; z-index:9999; color:#ff5555; background:rgba(0,0,0,0.9); padding:15px; font-family:monospace; border:1px solid #ff5555; pointer-events:none;';
                document.body.appendChild(errorDiv);
            }
            errorDiv.innerHTML += 'Error: ' + e.message + '<br>';
        });
    </script>
</head>
<body>
    <div id="game-container"></div>

    <!-- Main Menu -->
    <div id="main-menu" class="overlay">
        <h1 class="title">NEON<br><span class="magenta">RUSH</span></h1>
        <div class="subtitle">TIME TRIAL</div>
        <div class="rules">ONE TRACK // ONE CAR // ONE BEST TIME</div>
        <button id="btn-start" class="btn">START RACE</button>
        <div class="best-time-display">BEST TIME: <span id="menu-best-time">--:--.---</span></div>
        <div class="controls">
            <p>W / ARROWS - DRIVE &nbsp;|&nbsp; SPACE - DRIFT</p>
            <p>R - RESTART &nbsp;|&nbsp; ESC - PAUSE</p>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="overlay hidden">
        <div class="top-bar">
            <div id="timer">00:00.000</div>
            <div id="checkpoints">CHK: 0 / 8</div>
        </div>
        <div class="bottom-bar">
            <div id="speed">0 KM/H</div>
        </div>
        <div id="countdown" class="hidden">3</div>
        <div id="message" class="hidden">NEW RECORD!</div>
    </div>

    <!-- Pause Menu -->
    <div id="pause-menu" class="overlay hidden">
        <h2 class="title">PAUSED</h2>
        <button id="btn-resume" class="btn">RESUME</button>
        <button id="btn-restart-pause" class="btn">RESTART</button>
    </div>

    <!-- Finish Screen -->
    <div id="finish-screen" class="overlay hidden">
        <h2 class="title magenta">FINISH!</h2>
        <div class="time-result">
            <div id="finish-time">00:00.000</div>
            <div id="finish-best-time" class="best-time-display">BEST: --:--.---</div>
        </div>
        <div id="record-notification" class="hidden cyan glow">NEW RECORD!</div>
        <button id="btn-restart-finish" class="btn mt-2">PLAY AGAIN</button>
    </div>

    <!-- Import Map for Three.js (Switched to jsDelivr for better stability) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
